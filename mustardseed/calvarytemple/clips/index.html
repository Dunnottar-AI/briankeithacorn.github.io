ది. ‖ When we remember what God has carried us through and thank Him first, peace settles into our home.", "date": "2026-10-25", "book": ""}, {"id": "clip-wrIOUIWLs-k", "v": "wrIOUIWLs-k", "s": 95, "e": 185, "ref": "యెషయా 41:10 ‖ Isaiah 41:10", "who": "డా. పి. సతీష్ కుమార్ ‖ Dr. P. Satish Kumar", "title": "దేవునితో ప్రతిదినం ‖ Today God's Promise (Oct 28)", "topic": "Peace", "cap": [[95.5, "భయపడకుము, దిగులుపడకుము, నేనే నీ దేవుడను అని ప్రభువు సెలవిచ్చుచున్నాడు."], [102.0, "Do not look around in fear today. The God who called you promises to strengthen and uphold you."], [110.0, "భయపడకుము, నేను నీతో ఉన్నాను అని వాగ్దానం చేసిన దేవుడు ఈ దినమంతా తన దక్షిణ హస్తముతో మిమ్మును ఆదుకొనును."], [120.0, "God's daily promise that we do not walk into today's responsibilities alone because His right hand upholds us."]], "pull": "భయపడకుము, దిగులుపడకుము, నేనే నీ దేవుడను అని ప్రభువు సెలవిచ్చుచున్నాడు. ‖ Do not look around in fear today. The God who called you promises to strengthen and uphold you.", "date": "2026-10-28", "book": ""}, {"id": "clip-CgZr8nXUo6U", "v": "CgZr8nXUo6U", "s": 95, "e": 185, "ref": "యెషయా 53:4–5 ‖ Isaiah 53:4–5", "who": "డా. పి. సతీష్ కుమార్ ‖ Dr. P. Satish Kumar", "title": "ప్రభువు బల్ల ఆరాధన ‖ 3rd Sunday Holy Communion & Healing Service", "topic": "Suffering", "cap": [[95.5, "ఆయన పొందిన దెబ్బలచేత మనకు స్వస్థత కలుగుచున్నది; సిలువ యొద్ద మన ప్రతి భారము తొలగిపోవును."], [102.0, "At the cross of Christ, our heavy burdens are lifted and our wounded hearts find true peace."], [110.0, "కల్వరి సిలువలో యేసుక్రీస్తు కార్చిన రక్తము ద్వారా మనకు పాపక్షమాపణ, సమాధానము మరియు స్వస్థత కలుగుచున్నది."], [120.0, "Approaching the Lord's Table in remembrance of Christ's sacrifice, which brings forgiveness, peace, and healing."]], "pull": "ఆయన పొందిన దెబ్బలచేత మనకు స్వస్థత కలుగుచున్నది; సిలువ యొద్ద మన ప్రతి భారము తొలగిపోవును. ‖ At the cross of Christ, our heavy burdens are lifted and our wounded hearts find true peace.", "date": "2026-10-18", "book": ""}, {"id": "clip-CPtu8gjCV2I", "v"   };

  function splitPipeNode(node){
    if(!node || node.nodeType !== 3) return;
    var val = node.nodeValue;
    if(!val || val.indexOf('‖') === -1) return;
    var parent = node.parentNode;
    if(!parent) return;
    var tag = parent.nodeName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TITLE' || tag === 'TEXTAREA') return;
    if(tag === 'OPTION'){
      var partsOpt = val.split(/\s*‖\s*/);
      parent.setAttribute('data-te-opt', partsOpt[0]);
      parent.setAttribute('data-en-opt', partsOpt[1] || partsOpt[0]);
      var curL = document.documentElement.getAttribute('data-lang') || 'te';
      node.nodeValue = (curL === 'en') ? (partsOpt[1] || partsOpt[0]) : partsOpt[0];
      return;
    }
    var parts = val.split(/\s*‖\s*/);
    if(parts.length < 2) return;
    var frag = document.createDocumentFragment();
    var sTe = document.createElement('span');
    sTe.className = 'i18n-te';
    sTe.textContent = parts[0];
    var sEn = document.createElement('span');
    sEn.className = 'i18n-en';
    sEn.textContent = parts.slice(1).join(' · ');
    frag.appendChild(sTe);
    frag.appendChild(sEn);
    parent.replaceChild(frag, node);
  }

  function scanTree(root){
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    var n;
    while((n = walker.nextNode())) {
      if(n.nodeValue && n.nodeValue.indexOf('‖') !== -1) nodes.push(n);
    }
    for(var i=0;i<nodes.length;i++) splitPipeNode(nodes[i]);

    // Also tag exact UI strings once so they switch cleanly
    root.querySelectorAll && root.querySelectorAll('span,b,h1,h2,h3,summary,button,a.btn,label').forEach(function(el){
      if(el.children.length === 0 && !el.hasAttribute('data-ui-key')){
        var t = (el.textContent || '').trim();
        if(UI_MAP[t]){
          el.setAttribute('data-ui-key', t);
        }
      }
    });
  }

  var obs = null;
  var busy = false;
  function applyLang(lang){
    if(busy) return;
    busy = true;
    if(obs) obs.disconnect();
    try{
      if(lang !== 'en' && lang !== 'te') lang = 'te';
      document.documentElement.setAttribute('data-lang', lang);
      try{ localStorage.setItem(KEY, lang); }catch(e){}
      if(document.body) scanTree(document.body);

      document.querySelectorAll('.lang-btn-te').forEach(function(b){
        b.classList.toggle('active', lang === 'te');
      });
      document.querySelectorAll('.lang-btn-en').forEach(function(b){
        b.classList.toggle('active', lang === 'en');
      });

      document.querySelectorAll('[data-ui-key]').forEach(function(el){
        var k = el.getAttribute('data-ui-key');
        var pair = UI_MAP[k];
        if(pair){
          var want = (lang === 'en') ? pair[1] : pair[0];
          if(el.textContent !== want) el.textContent = want;
        }
      });
      document.querySelectorAll('option[data-te-opt]').forEach(function(opt){
        var wantOpt = (lang === 'en') ? opt.getAttribute('data-en-opt') : opt.getAttribute('data-te-opt');
        if(opt.textContent !== wantOpt) opt.textContent = wantOpt;
      });
      document.querySelectorAll('input[type="search"]').forEach(function(inp){
        var al = inp.getAttribute('aria-label') || '';
        var pair = PLACEHOLDER_MAP[al];
        if(pair) inp.setAttribute('placeholder', (lang === 'en') ? pair[1] : pair[0]);
      });
    }finally{
      busy = false;
      if(obs && document.body) obs.observe(document.body, {childList: true, subtree: true, characterData: true});
    }
  }

  window.setCalvaryLang = applyLang;

  var initLang = 'te';
  try{
    var qp = new URLSearchParams(location.search).get('lang');
    if(qp === 'en' || qp === 'te') initLang = qp;
    else initLang = localStorage.getItem(KEY) || 'te';
  }catch(e){}
  document.documentElement.setAttribute('data-lang', initLang);

  function boot(){
    if(document.body && !document.querySelector('.lang-pill')){
      var fp = document.createElement('div');
      fp.className = 'lang-pill';
      fp.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top));right:max(12px,calc(50% - 228px));z-index:10002;box-shadow:0 2px 8px rgba(0,0,0,.25)';
      fp.innerHTML = '<button type="button" class="lang-btn-te active" onclick="window.setCalvaryLang&&window.setCalvaryLang(\'te\')">తెలుగు</button><button type="button" class="lang-btn-en" onclick="window.setCalvaryLang&&window.setCalvaryLang(\'en\')">English</button>';
      document.body.appendChild(fp);
    }
    applyLang(document.documentElement.getAttribute('data-lang') || initLang);
    if(document.body && window.MutationObserver){
      obs = new MutationObserver(function(muts){
        if(busy) return;
        var need = false;
        for(var i=0;i<muts.length;i++){
          if(muts[i].addedNodes && muts[i].addedNodes.length) { need = true; break; }
          if(muts[i].type === 'characterData' && muts[i].target && muts[i].target.nodeValue && muts[i].target.nodeValue.indexOf('‖') !== -1){
            need = true; break;
          }
        }
        if(need){
          applyLang(document.documentElement.getAttribute('data-lang') || 'te');
        }
      });
      obs.observe(document.body, {childList: true, subtree: true, characterData: true});
    }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
