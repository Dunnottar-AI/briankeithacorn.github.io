lse, "label": "From Pastor Jeff\u2019s sermon \u201cHeritage Month - Jeff Turner\u201d", "context_start": 3609, "context_end": 3714, "context_status": "auto"}, "2026-10-24": {"reference": "2 John 1:4", "status": "ok", "speaker": "Pastor Jeff", "video_id": "1uEuq9GsjSg", "t": 768, "question": "But how many of you truly know that if you are in Christ, God loves you and therefore you get to walk in the truth?", "source_quote": "But but how many of you truly know that if you are in Christ, God loves you and therefore you get to walk in the truth?", "adapted": false, "label": "From Pastor Jeff\u2019s sermon \u201cWalking In Truth: 2 John 1:4\u201d", "context_start": 708, "context_end": 813, "context_status": "auto"}, "2026-10-25": {"reference": "2 John 1:3", "status": "ok", "speaker": "Pastor Jeff", "video_id": "SzzUlzMcSkQ", "t": 1000, "question": "By God's grace through faith in Christ, do you understand what you've been called to?", "source_quote": "By God's grace through faith in Christ, do you understand what you've been called to?", "adapted": false, "label": "From Pastor Jeff\u2019s sermon \u201c1 Corinthians: Chapter 4\u201d", "context_start": 940, "context_end": 1045, "context_status": "auto"}, "2026-10-26": {"reference": "2 John 1:8", "status": "ok", "speaker": "Pastor Jeff", "video_id": "Ibm_JQGEj44", "t": 902, "question": "How often do you and I find ourselves slowly walking away from the Lord in different areas of our life?", "source_quote": "How often do you and I find ourselves slowly walking away from the Lord in different areas of our life?", "adapted": false, "label": "From Pastor Jeff\u2019s sermon \u201cThe Book of Psalms - Psalms 78\u201d", "context_start": 842, "context_end": 947, "context_status": "auto"}, "2026-10-27": {"reference": "3 John 1:4", "status": "ok", "speaker": "Pastor Jeff", "video_id": "98TZsZIPB-Y", "t": 1535, "question": "And how often do we treat God as I'm going to serve you in hopes that you'll bless my life?", "source_quote": "And how often do we treat God as I'm going to serve you in hopes that you'll bless my life?", "adapted": false, "label": "From Pastor Jeff\u2019s sermon \u201cThe Book of Psalms - Psalm 4\u201d", "context_start": 1475, "context_end": 1580, "context_status": "auto"}, "2026-10-28": {"reference": "3 John 1:11", "status": "ok", "speaker": "Pastor Jeff", "video_id": "OHbwBEFdAho", "t": 2933, "question": "You're like, how should I live like Christ?", "source_quote": "You're like, how should I live like Christ?", "adapted": false, "label": "From Pastor Jeff\u2019s sermon \u201cHeritage Month - Jeff Turner\u201d", "context_start": 2873, "context_end": 2978, "context_status": "auto"}}, "days": [{"date": "2026-10-22", "weekday": "Thu", "reference": "2 John 1:6", "translation": "ESV", "text": "And this is love, that we walk according to his commandments; this is the commandment, just as you have heard from the beginning, so that you should walk in it.", "text_status": "from ESV API 2026-10-22", "study_link": {"video_id": "1uEuq9GsjSg", "start_sec": 1090, "clip": {"start": 1075, "end": 1180, "status": "auto"}}, "highlights": [{"t": 1120, "q": "It is I obey because he loves me and therefore I walk in the truth.", "video_id": "1uEuq9GsjSg", "speaker": "Pastor Jeff Turner", "church": "Camano Chapel", "sermon": "Walking In Truth: 2 John 1:4", "date": "2026-10-11", "status": "verbatim from captions"}]}, {"date": "2026-10-23", "weekday": "Fri", "reference": "2 John 1:5", "translation": "ESV", "text": "And now I ask you, dear lady\u2014not as though I were writing you a new commandment, but the one we have had from the beginning\u2014that we love one another.", "text_status": "from ESV API 2026-10-22", "study_link": {"video_id": "1uEuq9GsjSg", "start_sec": 1822, "clip": {"start": 1807, "end": 1912, "status": "auto"}}, "highlights": [{"t": 1852, "q": "I can't really love you unless I've experienced his love.", "video_id": "1uEuq9GsjSg", "speaker": "Pastor Jeff Turner", "church": "Camano Chapel", "sermon": "Walking In Truth: 2 John 1:4", "date": "2026-10-11", "status": "verbatim from captions"}]}, {"date": "2026-10-24", "weekday": "Sat", "reference": "2 John 1:4", "translation": "ESV", "text": "I rejoiced greatly to find some of your children walking in the truth, just as we were commanded by the Father.", "text_status": "from ESV API 2026-10-22", "study_link": {"video_id": "1uEuq9GsjSg", "start_sec": 1943, "clip": {"start": 1928, "end": 2033, "status": "auto"}}, "highlights": [{"t": 1973, "q": "It is knowing the truth of God in the cross that I am loved, accepted and called by him and therefore I get to walk in truth and enjoy him forever.", "video_id": "1uEuq9GsjSg", "speaker": "Pastor Jeff Turner", "church": "Camano Chapel", "sermon": "Walking In Truth: 2 John 1:4", "date": "2026-10-11", "status": "verbatim from captions"}]}, {"date": "2026-10-25", "weekday": "Sun", "reference": "2 John 1:3", "translation": "ESV", "text": "Grace, mercy, and peace will be with us, from God the Father and from Jesus Christ the Father\u2019s Son, in truth and love.", "text_status": "from ESV API 2026-10-22", "study_link": {"video_id": "1uEuq9GsjSg", "start_sec": 1740, "clip": {"start": 1725, "end": 1830, "status": "auto"}}, "highlights": [{"t": 1770, "q": "God is pleased that you're his child.", "video_id": "1uEuq9GsjSg", "speaker": "Pastor Jeff Turner", "church": "Camano Chapel", "sermon": "Walking In Truth: 2 John 1:4", "date": "2026-10-11", "status": "verbatim from captions"}]}, {"date": "2026-10-26", "weekday": "Mon", "reference": "2 John 1:8", "translation": "ESV", "text": "Watch yourselves, so that you may not lose what we have worked for, but may win a full reward.", "text_status": "from ESV API 2026-10-22", "study_link": {"video_id": "1uEuq9GsjSg", "start_sec": 1351, "clip": {"start": 1336, "end": 1441, "status": "auto"}}, "highlights": [{"t": 1381, "q": "Walking in God's truth is receiving him, learning from him, and having rest even in the work that God  var ks=Object.keys(q).sort();while(ks.length>14)delete q[ks.shift()];localStorage.setItem(KEY,JSON.stringify(q))}catch(e){}}
window.msCount=add;

 if(matchMedia('(display-mode: standalone)').matches&&!localStorage.getItem(KEY+':inst')){localStorage.setItem(KEY+':inst',1);var src=(new URLSearchParams(location.search).get('src')||'direct').replace(/[^a-z0-9_]/gi,'').slice(0,20);add('install_'+src)}}

 if(t.dataset.do)add('step_'+t.dataset.do);if(t.dataset.hear)add('pastor_question_heard');

})();
/* Weekly count (Brian approved 2026-10-22): at most one ping per device per ISO week. Sends only church, week, first-open week and app version. No ID, no content. */
(function(){var U='https://mustard-seed-counts.mustardseed-westwood.workers.dev';if(!U||U.indexOf('http')!==0||!window.fetch)return;
 function iso(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=t.getUTCFullYear(),w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+'-W'+(w<10?'0':'')+w}
 try{var CID='camano',wk=iso(new Date()),ck='ms-cohort:'+CID,pk='ms-ping:'+CID,co=localStorage.getItem(ck);if(!co){co=wk;localStorage.setItem(ck,co)}
  if(localStorage.getItem(pk)===wk||!navigator.onLine)return;
  fetch(U+'/ping',{method:'POST',mode:'cors',credentials:'omit',keepalive:true,referrerPolicy:'no-referrer',headers:{'Content-Type':'text/plain'},body:JSON.stringify({church:CID,week:wk,cohort_week:co,app_version:'1'})}).then(function(r){if(r.ok)localStorage.setItem(pk,wk)}).catch(function(){})}catch(e){}})();
