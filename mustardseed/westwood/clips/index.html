passive approach to this battle against the giant wall city. The he tells them to march around the city six time I mean for six days and then on the seventh day they're supposed to march around the city seven times and at the end shout and the walls would come a tumbling down."}, {"id": "john-15-5-j2u6", "v": "j2U6vmT06sw", "s": 888, "e": 981, "ref": "John 15:5", "who": "Pastor Jared", "title": "What We Really Need From God", "topic": "Money", "text": "We pray in his name. But a lot of times when we say in Jesus name, it's like we're just kind of signing off a prayer, signing off God in Jesus' name. But if we truly live by the power and authority of Christ, how would that shape how we lived? How would that change our prayers? How would that change our outlook and perspective and believing that God can do every anything? That he is creator, that he is sovereign lord, that he sits, he is king of kings and lord of lords. How would that change our thoughts and our faith of how we move forward? That we need to live as Christians in the power of Jesus. And that's what Peter wants everyone to know. It is not by my power. It is only by the power of Jesus. The same Jesus who walked out of the grave is the same Jesus who has allowed this man to walk. Jesus says this in John 15:5. He says,\"I am the vine and you are the branches.\" \"Whoever abides in me, he it he it is that bears much fruit. For apart from me, you can do nothing.\" Notice that Jesus doesn't say, \"Apart from me, you can do less.\" Or, \"Apart from me, you can just do a little bit.\" What does he say? Apart from me, you can do nothing. See, in the Christian life is that we cannot separate ourselves from God and think that we can produce spiritual fruit on our own, that we can just live life, you know, and just think, I'm just going to do it on my own."}, {"id": "psalms-50-x4fi", "v": "-4FiDwqk6W4", "s": 272, "e": 359, "ref": "Psalms 50", "who": "Pastor Jack", "title": "TOWDAH: Worship Before the Breakthrough",  and said,\"Oh Lord God of Israel, there is no God like you in heaven above or on earth beneath, keeping covenant and showing steadfast love to your servants who walk before you with all their heart."}, {"id": "exodus-16-pugu", "v": "pUguPu_QqM0", "s": 992, "e": 1080, "ref": "Exodus 16", "who": "Pastor Jared", "title": "When The Gospel Gets Personal", "topic": "Who is Jesus", "text": "Now, that miracle in and of itself is pretty cool, right? Like it's if we if we were to see that, if we were to be a part of that, we'd say, \"We need to take notice of this person.\" But the miracle isn't just contained in that. If we just read it, there's more to it because Jesus is drawing a parallel to Exodus chapter 16 in this moment when the Israelites are wandering through the wilderness and they run out of food and they start to complain a little bit and they start to say, \"How can we continue to move forward?\" And God gives them bread. Bread called mana for them to sustain life. And so here we have him. He's in he's so we have this wilderness feeding people. This bread Jesus now feeding a multitude of people in a wilderness with bread. And then in John 6, he says, \"I am the bread of life.\" He says, \"I was the same God who fed you, fed the Israelites back in Exodus 16. I am the God who's feeding you now. And I want you to know that I will continue feeding if you will. I I will feed you even more through salvation for all of eternity. I am that man. And Peter is saying all of this is happening in your midst. Peter knows. Listen, some of you heard him heard him in the flesh. Some of you saw him do miracles. Some of you might have been even in the crowd. But even if you you didn't you didn't see any of that."}, {"id": "matthew-11-aonm", "v": "aonMBrg7-20", "s": 1683, "e": 1774, "ref": "Matthew 11", "who": "Pastor Daniel", "title": "The Mustard Seed & Leaven", "topic": "Evangelism", "text": "Maybe I'm describing you. If that's the case, I would just invite you to come home to  tongues of fire appeared to them and rested on each one of them. And they were all filled with the Holy Spirit and began to speak in other tongues as the spirit gave them utterance. So, as we see that today is that day is the day of Pentecost. Now, Pentecost is a Jewish festival that was also known as the feast of weeks or shvatout. And so, it was associated with the grain harvest, the celebration of the grain harvest. And so, it was also over Jewish tradition and later on is that the Jewish also connected it to God giving them the law on Mount Si. And because it was one of the one of the three main festivals that required the Jews to come to Jerusalem is that Jerusalem is now filled with people from all over the world."}, {"id": "matthew-26-o8lz", "v": "O8lzOKrMnvE", "s": 961, "e": 1049, "ref": "Matthew 26", "who": "Pastor Rob", "title": "Then Failure is Not Final", "topic": "Healing", "text": "That Jesus meets Peter where he is, but he's not going to leave him there. Just as me Jesus meets each and every one of us where we are, but he doesn't leave us there. Let's continue reading John 21:15 and 15-17. When they had finished breakfast, Jesus said to Simon Peter,\"Simon son of John, do you love me more than these?\" He said to him, \"Yes, Lord, you know that I love you.\" And he said, \"Feed my lambs.\" He said to him a second time, \"Simon, son of John, do you love me?\" He said to him, \"Yes, Lord, you know that I love you.\" He said, \"Tend my sheep.\" He said to him a third time,\"Simon, son of John, do you love me?\" Peter was grieved because he had said to a third time, \"Do you love me?\" And he said to him, 'Lord, you know everything. You know that I love you? Jesus said to him, \"Feed my sheep.\" In this now, this interaction between Jesus and Peter is not the first time that they have interacted postresurrection, but it's certainly one of the most personal and profound and changing of Peter's entire life. But to us, it feels kind of weird. We're on the outside looking in. We don't understand the full weight. So to understand the full weight of this conversation, we need to go back just two weeks in Peter's life to an account recorded in Matthew 26 and Luke 22. I invite you to turn to Matthew 26 for this account. Matthew 26, starting at verse 30."}, {"id": "psalms-69-ygfz", "v": "ygFz4hCZP1s", "s": 877, "e": 966, "ref": "Psalms 69", "who": "Pastor Jared", "title": "How to Discern God’s Will", "topic": "Trusting the Bible", "text": "But they did life with him. And so they were struggling. What do we do with this position? How do we move forward? And and who's going to replace this friend of ours who so disappointed us? Well, Peter goes to scripture. Let's read verse 16. He says, \"Brothers, the scriptures had to be fulfilled.\" This is important because Peter's saying is that Jesus didn't make a mistake, right? It it wasn't that like Jesus Jesus got 11 of them right and man he missed the last one and and that led to the crucifixion. No J Jesus knew what was going to happen. Judas is responsible for his decisions. Jesus in his fornowledge knew that Judas was going to betray him. Chose Judas so that the scriptures would be fulfilled. So that Jesus will die on the cross for our So Peter says the scripture had to be fulfilled which the Holy Spirit spoke beforehand by the mouth of David concerning Judas who became a guide to those who arrested who arrested Jesus. Okay, so first I love how Peter is talking about scripture here, right? It's like he he brings them to two psalms, Psalm 69 and Psalm 109. And even though David wrote these psalms is that he is assigning the authorship to the Holy Spirit."}, {"id": "luke-23-b6l4", "v": "B6l4MhgvJWk", "s": 315, "e": 408, "ref": "Luke 23", "who": "Pastor Daniel", "title": "Sermon - Good Friday Service", "topic": "Cross", "text": "Love is demonstrated. The strongest form of love is always accompanied with sacrifice. But when we stop to acknowledge and actually stop to think about th
