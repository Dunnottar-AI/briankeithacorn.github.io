with a Pastor", "url": "https://westwoodbaptist.churchcenter.com/registrations/events/3932713"}, {"date": "2027-01-10", "title": "Discover Baptism", "url": "https://westwoodbaptist.churchcenter.com/registrations/events/3889929"}], "service": "10:30 AM", "addr": "333 Kaiser Rd NW, Olympia, WA 98502", "tier": "free", "church": "Westwood Baptist", "pastor": "Pastor Jared", "pq": {"2026-10-22": {"reference": "Acts 3:6", "status": "ok", "speaker": "Pastor Jared", "video_id": "j2U6vmT06sw", "t": 877, "question": "Are you living by the power and authority of Jesus?", "why": "Asked right after Peter says 'In the name of Jesus Christ of Nazareth, rise up and walk' (3:6).", "source_quote": "And that just makes me think, how many of us live by the power and authority of Jesus?", "adapted": true, "label": "From Pastor Jared's sermon", "context_start": 810.1, "context_end": 930.9, "context_status": "auto"}, "2026-10-23": {"reference": "Acts 3:4", "status": "ok", "speaker": "Pastor Jared", "video_id": "j2U6vmT06sw", "t": 810, "question": "Could you imagine being this guy?", "why": "Asked while walking through 'Look at us' (3:4) and the healing that follows.", "context_start": 741.5, "context_end": 855.7, "context_status": "auto"}, "2026-10-24": {"reference": "Acts 3:8", "status": "ok", "speaker": "Pastor Jared", "video_id": "j2U6vmT06sw", "t": 1145, "question": "Can you imagine being this man for 40 years never been able to walk and all of a sudden you have stood up.", "why": "About the man leaping and walking (3:8). Captions end it with a period; it is spoken as a question.", "context_start": 1095.1, "context_end": 1205, "context_status": "auto"}, "2026-10-25": {"reference": "Ephesians 3:20", "status": "NEEDS QUESTION", "note": "Verse is quoted at 9:11 (551s) but no question is asked about it."}, "2026-10-26": {"reference": "Philippians 4:19", "status": "NEEDS QUESTION", "note": "Verse is not cited in the sermon. Nearby theme question (not about this verse): 'If I asked you, wha
