.hero{position:relative;color:#fff;background:linear-gradient(180deg,rgba(38,43,40,.45),rgba(38,43,40,.6)),url(/mustardseed/westwood/img/hero.svg) 74% 15%/cover no-repeat #262b28!important;padding:clamp(56px,10vw,120px) 20px clamp(48px,8vw,96px);text-align:center}
.hero>*{position:relative}

.hero p{max-width:620px;margin:0 auto;opacity:.9}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}

.card:hover,.card:focus-visible{transform:translateY(-3px);outline:3px solid var(--lime)}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--sage)}

.card h2{font:400 28px/1.15 Georgia,serif;margin:6px 0 6px}.card p{margin:0;color:var(--muted);font-size:15px}
h2.sec{font:400 clamp(26px,4vw,38px)/1.15 Georgia,serif;margin:48px 0 16px}h2.sec:first-child{margin-top:0}
.crow{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px;margin:10px 0;text-decoration:none;color:var(--ink);box-shadow:0 1px 10px rgba(38,43,40,.06)}
.crow:hover,.crow:focus-visible{outline:2px solid var(--lime)}.crow img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none}

.btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:600;padding:12px 22px;border-radius:999px;text-decoration:none}
