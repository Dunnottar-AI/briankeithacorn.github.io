body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Poppins,system-ui,sans-serif;padding-bottom:120px}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font:700 20px/1.2 Poppins,system-ui,sans-serif}.brand img{width:34px;height:34px;border-radius:9px}
.sbox{display:flex;margin-top:12px;background:#fff;border-radius:999px}.sbox input{flex:1;min-width:0;border:0;background:none;font:17px Poppins,system-ui,sans-serif;padding:11px 18px;border-radius:999px;color:var(--ink)}.sbox input:focus{outline:3px solid var(--lime)}
main{max-width:760px;margin:0 auto;padding:0 16px}h2{font:400 26px/1.2 Georgia,serif;margin:26px 0 10px}
.acts{display:flex;gap:10px;margin:18px 0 4px}.btn{border:0;background:var(--lime);color:var(--ink);font-weight:600;padding:12px 20px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.alt{background:#fff;box-shadow:0 1px 8px rgba(38,43,40,.1)}
.rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -16px;padding-left:16px}.rail::-webkit-scrollbar{display:none}
.svc{flex:none;width:250px;scroll-snap-align:start;background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 14px rgba(38,43,40,.07)}.svc h3{margin:0 0 6px;font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.svc button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 0;font-size:16px;border-top:1px solid #eef0ec}.svc button:first-of-type{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px}.row a,.row .x{text-decoration:none}.tile{width:56px;height:56px;border-radius:10px;flex:none;display:grid;place-items:center;font:700 20px Poppins,system-ui,sans-serif;color:var(--ink)}.row:hover,.row.on{background:#fff}.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex:none;background:var(--sage)}
.row .t{display:block;font-weight:600;line-height:1.3}.row .m{display:block;font-size:14px;color:var(--muted)}.row .x{flex:1;min-width:0}.row .pl{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--lime);font-size:16px}
.row.on .t{color:#3b8a1f}.none{background:#fff;border-radius:14px;padding:16px;border-left:4px solid var(--lime)}
#stage{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding-bottom:6px}.vw{position:relative;background:#000;aspect-ratio:16/9;max-height:50vh;margin:0 auto}#bignx{width:calc(100% - 32px);margin:8px 16px 0}#stage.hide{display:none}
.lyr{background:#fff;border-radius:18px;padding:16px 18px;margin:14px 0;box-shadow:0 2px 14px rgba(38,43,40,.07)}.lyr h3{font:600 14px Poppins,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}.lyr h3:first-of-type{margin-top:4px}
.lyr p{font:600 26px/1.45 Poppins,system-ui,sans-serif;margin:4px 0;padding:2px 6px;border-radius:10px;scroll-margin-top:62vh;scroll-margin-bottom:110px}.lyr p.cl{background:#f1f8ec}.lyr .w{border-radius:6px;padding:0 2px;transition:background .15s}.lyr .w.on{background:#ffd60a;color:#111}.lyr .w.done{color:#3b8a1f}.vw iframe,#vid{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.song h1{font:400 30px/1.2 Georgia,serif;margin:18px 0 4px}.song .m{color:var(--muted)}.dates{list-style:none;padding:0}.dates li{margin:6px 0}.dates button{border:0;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 1px 6px rgba(38,43,40,.08)}
.note{font-size:15px;color:var(--muted);background:#fff;border-radius:14px;padding:12px 16px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px}#bar.hide{display:none}

function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ctx(l){if(l==='az')return [...SONGS].sort((a,b)=>a.t.localeCompare(b.t)).map(x=>x.s);if(l==='q'){const q=$('s').value.trim().toLowerCase();const r=SONGS.filter(x=>x.t.toLowerCase().includes(q)).map(x=>x.s);return r.concat(SONGS.map(x=>x.s).filter(x=>!r.includes(x)))}return SONGS.map(x=>x.s)}
function listFrom(s,l){const all=ctx(l),i=all.indexOf(s.s);let rest=all.slice(i+1).concat(all.slice(0,i));if(shuf)rest=mix(rest);return [s.s].concat(rest)}
function cur(){return qi>=0?BY[Q[qi]]:null}
function startList(l,i){Q=l;qi=i;play()}
function play(){const s=cur();if(!s)return;const c=clipOf[s.s]||s.c[0];$('stage').classList.remove('hide');$('bar').classList.remove('hide');
 $('nt').textContent=s.t;$('nd').textContent='Sung '+fd(c[3]);if(!(LYR[s.s]&&location.hash==='#/song/'+s.s))window.scrollTo({top:0,behavior:'smooth'});LK='';if(LYR[s.s]&&location.hash==='#/song/'+s.s)render();
 const o={videoId:c[0],startSeconds:c[1],endSeconds:c[2]};if(ready)P.loadVideoById(o);else pend=o;
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:'Westwood Worship',artwork:[{src:th(c[0]),sizes:'320x180'}]});
 drawQ();document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',!!r.querySelector('[data-p="'+s.s+'"]')))}
function next(){if(!Q.length){const h=location.hash,s=h.startsWith('#/song/')&&BY[h.slice(7)];if(s){startList(listFrom(s,FROM),1);return}startList(ctx(FROM),0);return}if(qi<Q.length-1){qi++;play()}else{qi=0;play()}}
function prev(){const s=cur(),c=s&&(clipOf[s.s]||s.c[0]);if(ready&&c&&P.getCurrentTime()-c[1]>5){P.seekTo(c[1],true);return}if(qi>0){qi--;play()}}
function setShuf(){$('sh').classList.toggle('on',shuf);$('sh').setAttribute('aria-pressed',shuf)}
function drawQ(){$('ql').innerHTML=Q.slice(qi,qi+40).map((sl,k)=>{const s=BY[sl];return `<div class="row${k===0?' on':''}">${tile(s)}<span class=x><span class=t>${k===0?'Now: ':''}${esc(s.t)}</span><span class=m>${fd(s.c[0][3])}</span></span><button class=pl data-j="${qi+k}" aria-label="Play ${esc(s.t)}">${IC.play}</button></div>`}).join('');
 document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{qi=+b.dataset.j;play()})}
$('nx').onclick=next;$('bignx').onclick=next;$('pv').onclick=prev;$('qb').onclick=()=>{drawQ();$('q').classList.remove('hide')};$('qx').onclick=()=>$('q').classList.add('hide');
$('sh').onclick=()=>{shuf=!shuf;setShuf();if(qi>=0){const rest=Q.slice(qi+1);Q=Q.slice(0,qi+1).concat(shuf?mix(rest):SONGS.map(s=>s.s).filter(x=>rest.includes(x)));drawQ()}};
$('pp').onclick=()=>{if(!ready)return;playing?P.pauseVideo():P.playVideo()};
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('nexttrack',next);navigator.mediaSession.setActionHandler('previoustrack',prev)}

 events:{onReady:()=>{ready=true;if(pend){P.loadVideoById(pend);pend=null}},onStateChange:e=>{playing=e.data===1;$('pp').innerHTML=playing?IC.pause:IC.play;if(e.data===0)next()}}})};
setInterval(()=>{if(!ready||!playing)return;const s=cur(),c=s&&(clipOf[s.s]||s.c[0]);if(!c)return;const t=P.getCurrentTime();$('prog').style.width=Math.min(100,Math.max(0,(t-c[1])/(c[2]-c[1])*100))+'%';if(t>=c[2]-.3)next()},500);

render();if(location.hash.startsWith('#/song/'))loadApi();
